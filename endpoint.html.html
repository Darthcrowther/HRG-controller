<script>

let automationArmed = false;

const statusDiv =
    document.getElementById("status");

document
    .getElementById("armBtn")
    .addEventListener("click", function(){

        automationArmed = true;

        statusDiv.innerHTML =
            "WAITING FOR COMMAND";

    });

document
    .getElementById("disarmBtn")
    .addEventListener("click", function(){

        automationArmed = false;

        statusDiv.innerHTML =
            "READY";

    });

function checkForCommand(){

    if(!automationArmed){
        return;
    }

    statusDiv.innerHTML =
        "CHECKING FOR COMMAND";

    setTimeout(function(){

        if(automationArmed){

            statusDiv.innerHTML =
                "WAITING FOR COMMAND";

        }

    },2000);

}

setInterval(function(){

    checkForCommand();

},5000);

</script>
