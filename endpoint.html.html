<script>

let automationArmed = false;

const statusDiv =
    document.getElementById("status");

document
    .getElementById("armBtn")
    .addEventListener("click", function(){

        automationArmed = true;

        statusDiv.innerHTML =
            "WAITING FOR COMMAND";

    });

document
    .getElementById("disarmBtn")
    .addEventListener("click", function(){

        automationArmed = false;

        statusDiv.innerHTML =
            "READY";

        document.getElementById("urlDisplay").innerHTML =
            "NO URL RECEIVED";

    });

function checkForCommand(){

    if(!automationArmed){
        return;
    }

    statusDiv.innerHTML =
        "CHECKING FOR COMMAND";

    fetch(
        "https://darthcrowther.github.io/HRG-controller/command.txt?nocache=" +
        Date.now()
    )
    .then(response => response.text())
    .then(command => {

        const parts =
            command.trim().split("|");

        const endpoint =
            parts[0];

        const action =
            parts[1];

        const meetingURL =
            parts[2];

        if(
            endpoint === "EP-001" &&
            action === "JOIN"
        ){

            statusDiv.innerHTML =
                "HEARING REQUEST RECEIVED";

            window.meetingURL =
                meetingURL;

            document.getElementById(
                "urlDisplay"
            ).innerHTML =
                meetingURL;

        }
        else if(
            endpoint === "EP-001" &&
            action === "END"
        ){

            statusDiv.innerHTML =
                "REQUEST CANCELLED";

            document.getElementById(
                "urlDisplay"
            ).innerHTML =
                "NO URL RECEIVED";

        }
        else{

            statusDiv.innerHTML =
                "WAITING FOR COMMAND";

            document.getElementById(
                "urlDisplay"
            ).innerHTML =
                "NO URL RECEIVED";

        }

    })
    .catch(() => {

        statusDiv.innerHTML =
            "COMMAND FILE ERROR";

    });

}

setInterval(function(){

    checkForCommand();

},5000);

</script>
