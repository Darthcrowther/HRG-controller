<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>HMCTS Endpoint Controller</title>

<style>

body{
    margin:0;
    background:#f3f2f1;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    background:#003078;
    color:white;
    padding:25px;
    font-size:32px;
    font-weight:bold;
}

.panel{
    background:white;
    width:700px;
    margin:40px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.endpoint{
    font-size:28px;
    color:#003078;
    font-weight:bold;
    margin-bottom:20px;
}

.status{
    font-size:24px;
    margin:25px;
    color:#003078;
    font-weight:bold;
    word-break:break-word;
}

button{
    width:420px;
    height:90px;
    border:none;
    border-radius:8px;
    font-size:26px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    margin:15px;
}

.arm{
    background:#00703c;
}

.arm:hover{
    background:#005a30;
}

.disarm{
    background:#d4351c;
}

.disarm:hover{
    background:#b10e1e;
}

</style>

</head>

<body>

<div class="header">
HMCTS ENDPOINT CONTROLLER
</div>

<div class="panel">

<div class="endpoint">
Endpoint: EP-001
</div>

<div id="status" class="status">
READY
</div>

<div id="urlDisplay" class="status">
NO URL RECEIVED
</div>

<button class="arm" id="armBtn">
ARM AUTOMATION
</button>

<br>

<button class="disarm" id="disarmBtn">
DISARM
</button>

</div>

<script>

let automationArmed = false;

const statusDiv =
    document.getElementById("status");

document
    .getElementById("armBtn")
    .addEventListener("click", function(){

        automationArmed = true;

        statusDiv.innerHTML =
            "WAITING FOR COMMAND";

    });

document
    .getElementById("disarmBtn")
    .addEventListener("click", function(){

        automationArmed = false;

        statusDiv.innerHTML =
            "READY";

        document.getElementById("urlDisplay").innerHTML =
            "NO URL RECEIVED";

    });
