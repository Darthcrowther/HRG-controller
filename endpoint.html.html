<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HMCTS Endpoint Controller</title>

<style>

body{
    margin:0;
    background:#f3f2f1;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    background:#003078;
    color:white;
    padding:25px;
    font-size:32px;
    font-weight:bold;
}

.panel{
    background:white;
    width:650px;
    max-width:90%;
    margin:40px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.status{
    font-size:28px;
    color:#003078;
    font-weight:bold;
    margin-bottom:20px;
}

.endpoint{
    font-size:20px;
    color:#666;
    margin-bottom:25px;
}

.urlBox{
    border:1px solid #ddd;
    background:#f8f8f8;
    padding:15px;
    border-radius:5px;
    margin:20px;
    word-break:break-all;
}

button{
    width:300px;
    height:70px;
    font-size:22px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    margin:10px;
}

.arm{
    background:#00703c;
}

.disarm{
    background:#d4351c;
}

</style>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

</head>

<body>

<div class="header">
HMCTS ENDPOINT
</div>

<div class="panel">

<div class="endpoint">
Endpoint: EP-001
</div>

<div id="status" class="status">
READY
</div>

<div id="urlDisplay" class="urlBox">
NO URL RECEIVED
</div>

<button
class="arm"
onclick="armEndpoint()">
ARM ENDPOINT
</button>

<br>

<button
class="disarm"
onclick="disarmEndpoint()">
DISARM ENDPOINT
</button>

</div>
