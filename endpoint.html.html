<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HMCTS Endpoint</title>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

<style>

body{
    margin:0;
    background:#f3f2f1;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    background:#003078;
    color:white;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}

.panel{
    background:white;
    width:700px;
    max-width:90%;
    margin:40px auto;
    padding:30px;
    border-radius:10px;
}

.status{
    font-size:32px;
    font-weight:bold;
    color:#003078;
    margin-bottom:20px;
}

.urlBox{
    border:1px solid #ccc;
    padding:15px;
    min-height:40px;
    margin-bottom:20px;
    word-break:break-all;
}

button{
    width:300px;
    height:70px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:22px;
    cursor:pointer;
    margin:10px;
}

.launch{
    background:#00703c;
}

.end{
    background:#d4351c;
}

</style>

</head>
<body>

<div class="header">
HMCTS ENDPOINT CONTROLLER
</div>

<div class="panel">

<div id="status" class="status">
READY
</div>

<div id="automationCommand" style="display:none;">
NONE
</div>

<div id="urlDisplay" class="urlBox">
NO URL RECEIVED
</div>

<button class="launch" onclick="armEndpoint()">
ARM ENDPOINT
</button>

<button class="end" onclick="manualEnd()">
END HEARING
</button>

</div>

<script>

let endpointReady = false;
let hearingWindow = null;

function setStatus(text){
    document.getElementById("status").innerText = text;
}

function setCommand(text){
    document.getElementById("automationCommand").innerText = text;
}

function armEndpoint(){

    endpointReady = true;

    setStatus("WAITING FOR HEARING");
    setCommand("NONE");

    console.log("ENDPOINT ARMED");
}

function openHearing(url){

    if(hearingWindow && !hearingWindow.closed){
        return;
    }

    hearingWindow = window.open(
        url,
        "_blank"
    );

    setStatus("HEARING ACTIVE");
    setCommand("JOIN");

    console.log("HEARING OPENED");
}

function closeHearing(){

    setStatus("HEARING ENDED");
    setCommand("END");

    try{

        if(hearingWindow && !hearingWindow.closed){

            hearingWindow.close();

            console.log("HEARING WINDOW CLOSED");
        }

    }catch(err){

        console.log("CLOSE FAILED", err);
    }
}

function manualEnd(){

    closeHearing();
}

const ably = new Ably.Realtime(
    "rLuvXQ.hsU1zg:lupB30Cvln6FU__Lkk-aRWKyHCGnZ5cqV_Sp9MD4LP4"
);

const channel = ably.channels.get("hearings");

channel.subscribe("hearing", function(message){

    if(!endpointReady){
        return;
    }

    const data = message.data || {};

    console.log("MESSAGE", data);

    if(data.action === "JOIN"){

        document.getElementById("urlDisplay").innerText =
            data.url || "NO URL RECEIVED";

        openHearing(data.url);
    }

    if(data.action === "END"){

        closeHearing();

        document.getElementById("urlDisplay").innerText =
            "NO URL RECEIVED";
    }

});

</script>

</body>
</html>
