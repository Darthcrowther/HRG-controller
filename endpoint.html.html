<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HMCTS Endpoint Controller</title>

<style>

body{
    margin:0;
    background:#f3f2f1;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    background:#003078;
    color:white;
    padding:25px;
    font-size:32px;
    font-weight:bold;
}

.panel{
    background:white;
    width:600px;
    max-width:90%;
    margin:40px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.endpoint{
    font-size:28px;
    color:#003078;
    font-weight:bold;
    margin-bottom:20px;
}

.status{
    font-size:24px;
    margin:25px 0;
    color:#003078;
    font-weight:bold;
}

#automaCommand{
    font-size:20px;
    color:#666;
    margin:15px 0;
}

#urlDisplay{
    margin:20px auto;
    padding:12px;
    border:1px solid #d8d8d8;
    border-radius:5px;
    background:#f8f8f8;
    font-size:16px;
    color:#003078;
    word-break:break-all;
}

button{
    width:320px;
    height:80px;
    border:none;
    border-radius:8px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    margin:10px;
}

.arm{
    background:#00703c;
}

.arm:hover{
    background:#005a30;
}

.disarm{
    background:#d4351c;
}

.disarm:hover{
    background:#b10e1e;
}

</style>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

</head>

<body>

<div class="header">
HMCTS ENDPOINT CONTROLLER
</div>

<div class="panel">

<div class="endpoint">
Endpoint: EP-001
</div>

<div id="status" class="status">
READY
</div>

<div id="automaCommand">
NONE
</div>

<div id="urlDisplay">
NO URL RECEIVED
</div>

<button
class="arm"
onclick="armAutomation()">
LAUNCH HEARING
</button>

<br>

<button
class="disarm"
onclick="disarmAutomation()">
CANCEL REQUEST
</button>

</div>

<script>

let automationArmed = false;

const ably = new Ably.Realtime(
    "rLuvXQ.hsU1zg:lupB30Cvln6FU__Lkk-aRWKyHCGnZ5cqV_Sp9MD4LP4"
);

const channel = ably.channels.get("hearings");

alert("ABLY LOADED");

channel.subscribe("hearing", function(message){

    if(!automationArmed){
        return;
    }

    const data = message.data || {};

    console.log("MESSAGE RECEIVED:", data);

    if(data.action === "JOIN"){

        document.getElementById("status").innerHTML =
            "HEARING STARTED";

        document.getElementById("automaCommand").innerHTML =
            "OPEN";

        document.getElementById("urlDisplay").innerHTML =
            data.url || "NO URL RECEIVED";

    }

    else if(data.action === "END"){

        document.getElementById("status").innerHTML =
            "HEARING ENDED";

        document.getElementById("automaCommand").innerHTML =
            "CLOSE";

        document.getElementById("urlDisplay").innerHTML =
            "NO URL RECEIVED";
    }

});

function armAutomation(){

    automationArmed = true;

    document.getElementById("status").innerHTML =
        "WAITING FOR COMMAND";

    document.getElementById("automaCommand").innerHTML =
        "NONE";

    document.getElementById("urlDisplay").innerHTML =
        "NO URL RECEIVED";
}

function disarmAutomation(){

    automationArmed = false;

    document.getElementById("status").innerHTML =
        "READY";

    document.getElementById("automaCommand").innerHTML =
        "NONE";

    document.getElementById("urlDisplay").innerHTML =
     </script>

</body>
</html>
