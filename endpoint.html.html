<script>

let automationArmed = false;

function armAutomation() {

    automationArmed = true;

    alert("AUTOMATION ARMED");

    document.getElementById("status").innerHTML =
        "WAITING FOR COMMAND";

}

function disarmAutomation() {

    automationArmed = false;

    document.getElementById("status").innerHTML =
        "READY";

}

async function checkForCommand() {

    if (!automationArmed) {
        return;
    }

    try {

        document.getElementById("status").innerHTML =
            "CHECKING FOR COMMAND";

        const response = await fetch(
            "https://darthcrowther.github.io/HRG-controller/command.txt?nocache=" +
            Date.now()
        );

        const command = (await response.text()).trim();

        if (command === "JOIN") {

            document.getElementById("status").innerHTML =
                "JOIN COMMAND RECEIVED";

        } else {

            document.getElementById("status").innerHTML =
                "WAITING FOR COMMAND";

        }

    }
    catch (error) {

        document.getElementById("status").innerHTML =
            "COMMAND CHECK FAILED";

        console.log(error);

    }

}

setInterval(checkForCommand, 5000);

</script>
