<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HMCTS Endpoint V2</title>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f3f2f1;
    margin:40px;
}

#status{
    font-size:32px;
    font-weight:bold;
    margin:20px;
    color:#003078;
}

#url{
    font-size:18px;
    margin:20px;
    padding:15px;
    border:1px solid #ccc;
    background:white;
}

button{
    width:300px;
    height:80px;
    margin:10px;
    font-size:24px;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.launch{
    background:#00703c;
}

.end{
    background:#d4351c;
}

</style>

</head>

<body>

<h1>HMCTS Endpoint V2</h1>

<div id="status">
READY
</div>

<div id="url">
NO URL RECEIVED
</div>

<button class="launch" onclick="startEndpoint()">
LAUNCH HEARING
</button>

<button class="end" onclick="stopEndpoint()">
END HEARING
</button>

<script>

let endpointReady = false;
let hearingWindow = null;

const ably = new Ably.Realtime(
    "rLuvXQ.hsU1zg:lupB30Cvln6FU__Lkk-aRWKyHCGnZ5cqV_Sp9MD4LP4"
);

const channel = ably.channels.get("hearings");

function startEndpoint(){

    endpointReady = true;

    document.getElementById("status").innerText =
        "WAITING FOR HEARING";

    console.log("ENDPOINT READY");
}

function stopEndpoint(){

    endpointReady = false;

    document.getElementById("status").innerText =
        "HEARING ENDED";

    document.getElementById("url").innerText =
        "NO URL RECEIVED";

    if(
        hearingWindow &&
        !hearingWindow.closed
    ){

        hearingWindow.close();

        console.log("WINDOW CLOSED");
    }

    hearingWindow = null;
}

channel.subscribe("hearing", function(message){

    if(!endpointReady){
        return;
    }

    const data = message.data || {};

    console.log("ABLY MESSAGE", data);

    if(data.action === "JOIN"){

        document.getElementById("status").innerText =
            "HEARING ACTIVE";

        document.getElementById("url").innerText =
            data.url || "NO URL RECEIVED";

        hearingWindow = window.open(
            data.url,
            "CVP_HEARING",
            "width=1600,height=1000"
        );

        console.log(
            "WINDOW REFERENCE:",
            hearingWindow
        );
    }

    if(data.action === "END"){

        document.getElementById("status").innerText =
            "WAITING FOR HEARING";

        document.getElementById("url").innerText =
            "NO URL RECEIVED";

        if(
            hearingWindow &&
            !hearingWindow.closed
        ){

            hearingWindow.close();

            console.log("HEARING WINDOW CLOSED");
        }
        else{

            console.log("NO WINDOW REFERENCE AVAILABLE");
        }

        hearingWindow = null;
    }

});

</script>

</body>
</html>
