<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>HMCTS Endpoint Controller</title>

<style>

body{
    margin:0;
    background:#f3f2f1;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    background:#003078;
    color:white;
    padding:25px;
    font-size:32px;
    font-weight:bold;
}

.panel{
    background:white;
    width:700px;
    margin:40px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.endpoint{
    font-size:28px;
    color:#003078;
    font-weight:bold;
    margin-bottom:20px;
}

.status{
    font-size:24px;
    margin:25px;
    color:#003078;
    font-weight:bold;
}

button{
    width:420px;
    height:90px;
    border:none;
    border-radius:8px;
    font-size:26px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    margin:15px;
}

.arm{
    background:#00703c;
}

.arm:hover{
    background:#005a30;
}

.disarm{
    background:#d4351c;
}

.disarm:hover{
    background:#b10e1e;
}

</style>
    
<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

</head>

<body>

<div class="header">
HMCTS ENDPOINT CONTROLLER
</div>

<div class="panel">

<div class="endpoint">
Endpoint: EP-001
</div>

<div id="status" class="status">
READY
</div>

<div id="urlDisplay" class="status">
NO URL RECEIVED
</div>

<button
class="arm"
onclick="armAutomation()">
LAUNCH HEARING
</button>

<br>

<button
class="disarm"
onclick="disarmAutomation()">
CANCEL REQUEST
</button>

</div>

<script>

let automationArmed = false;

const ably = new Ably.Realtime(
    "rLuvXQ.hsU1zg:lupB30Cvln6FU__Lkk-aRWKyHCGnZ5cqV_Sp9MD4LP4"
);

const channel =
    ably.channels.get("hearings");
alert("ABLY LOADED");
channel.subscribe("hearing", function(message){

    alert("MESSAGE RECEIVED");

});
function armAutomation(){

    automationArmed = true;

    document.getElementById("status").innerHTML =
        "WAITING FOR COMMAND";

}

function disarmAutomation(){

    automationArmed = false;

    document.getElementById("status").innerHTML =
        "READY";

    document.getElementById("urlDisplay").innerHTML =
        "NO URL RECEIVED";

}

function checkForCommand(){

    if(!automationArmed){
        return;
    }

    if(
        document.getElementById("status").innerHTML ===
        "HEARING REQUEST RECEIVED"
    ){
        return;
    }

    document.getElementById("status").innerHTML =
        "CHECKING FOR COMMAND";

    setTimeout(function(){

        if(
            automationArmed &&
            document.getElementById("status").innerHTML !==
            "HEARING REQUEST RECEIVED"
        ){

            document.getElementById("status").innerHTML =
                "WAITING FOR COMMAND";

        }

    },4000);

}

setInterval(function(){

    checkForCommand();

},5000);
channel.subscribe("hearing", function(message){

    if(!automationArmed){
        return;
    }

    const data = message.data;

document.getElementById("status").innerHTML =
    JSON.stringify(data);

    if(
        data.endpoint === "EP-001" &&
        data.action === "JOIN"
    ){

        document.getElementById("status").innerHTML =
            "HEARING REQUEST RECEIVED";

        document.getElementById("urlDisplay").innerHTML =
            data.url;

        window.meetingURL =
            data.url;

    }

    if(
        data.endpoint === "EP-001" &&
        data.action === "END"
    ){

        document.getElementById("status").innerHTML =
            "REQUEST CANCELLED";

        document.getElementById("urlDisplay").innerHTML =
            "NO URL RECEIVED";

        window.meetingURL = "";

    }

});
      
</script>

</body>

</html>
