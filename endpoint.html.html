<script>

alert("SCRIPT STARTED");

let automationArmed = false;

function armAutomation() {

    automationArmed = true;

    document.getElementById("status").innerHTML =
        "ARMED";

}

function disarmAutomation() {

    automationArmed = false;

    document.getElementById("status").innerHTML =
        "READY";

}

setInterval(function() {

    if (automationArmed) {

        document.getElementById("status").innerHTML =
            "TIMER WORKING";

    }

}, 5000);

</script>
