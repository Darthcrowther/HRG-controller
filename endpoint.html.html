<script>

let automationArmed = false;

function armAutomation() {

    automationArmed = true;

    document.getElementById("status").innerHTML =
        "WAITING FOR COMMAND";

}

function disarmAutomation() {

    automationArmed = false;

    document.getElementById("status").innerHTML =
        "READY";

}

function checkForCommand() {

    if (!automationArmed) {
        return;
    }

    document.getElementById("status").innerHTML =
        "CHECKING FOR COMMAND";

    setTimeout(function () {

        if (automationArmed) {

            document.getElementById("status").innerHTML =
                "WAITING FOR COMMAND";

        }

    }, 2000);

}

setInterval(checkForCommand, 5000);

</script>
