<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HMCTS - READY</title>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

<style>

body{
    margin:0;
    background:#f3f2f1;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    background:#003078;
    color:white;
    padding:25px;
    font-size:32px;
    font-weight:bold;
}

.panel{
    background:white;
    width:650px;
    max-width:90%;
    margin:40px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.endpoint{
    font-size:24px;
    font-weight:bold;
    color:#003078;
    margin-bottom:20px;
}

.status{
    font-size:28px;
    font-weight:bold;
    color:#003078;
    margin-bottom:20px;
}

.urlBox{
    background:#f8f8f8;
    border:1px solid #d8d8d8;
    border-radius:5px;
    padding:15px;
    margin:20px;
    min-height:40px;
    word-break:break-all;
}

button{
    width:320px;
    height:80px;
    border:none;
    border-radius:8px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    margin:10px;
}

.launch{
    background:#00703c;
}

.launch:hover{
    background:#005a30;
}

.end{
    background:#d4351c;
}

.end:hover{
    background:#b10e1e;
}

</style>

</head>

<body>

<div class="header">
HMCTS ENDPOINT CONTROLLER
</div>

<div class="panel">

<div class="endpoint">
Endpoint: EP-001
</div>

<div id="status" class="status">
READY
</div>

<div id="urlDisplay" class="urlBox">
NO URL RECEIVED
</div>

<button class="launch" onclick="launchHearing()">
LAUNCH HEARING
</button>

<br>

<button class="end" onclick="endHearing()">
END HEARING
</button>

</div>

<script>

let endpointReady = false;
let hearingActive = false;

const ably = new Ably.Realtime(
    "rLuvXQ.hsU1zg:lupB30Cvln6FU__Lkk-aRWKyHCGnZ5cqV_Sp9MD4LP4"
);

const channel = ably.channels.get("hearings");

function setStatus(status){

    document.getElementById("status").innerHTML =
        status;

    document.title =
        "HMCTS - " + status;
}

function launchHearing(){

    endpointReady = true;

    hearingActive = false;

    setStatus("WAITING FOR HEARING");

    document.getElementById("urlDisplay").innerHTML =
        "NO URL RECEIVED";

    console.log("ENDPOINT READY");
}

function endHearing(){

    endpointReady = false;

    hearingActive = false;

    setStatus("HEARING ENDED");

    document.getElementById("urlDisplay").innerHTML =
        "NO URL RECEIVED";

    console.log("MANUAL END");
}

channel.subscribe("hearing", function(message){

    if(!endpointReady){
        return;
    }

    const data = message.data || {};

    console.log("MESSAGE RECEIVED", data);

    if(data.action === "JOIN"){

        if(hearingActive){
            return;
        }

        hearingActive = true;

        setStatus("HEARING ACTIVE");

        document.getElementById("urlDisplay").innerHTML =
            data.url || "NO URL RECEIVED";

        if(data.url){

          window.open(
    data.url,
    "CVP_WINDOW",
    "width=1400,height=900"
);
``

            console.log("HEARING OPENED");
        }
    }

    if(data.action === "END"){

        hearingActive = false;

        setStatus("HEARING ENDED");

        document.getElementById("urlDisplay").innerHTML =
            "NO URL RECEIVED";

        console.log("END COMMAND RECEIVED");
    }

});

</script>

</body>
</html>
