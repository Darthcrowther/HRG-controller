<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HMCTS Hearing Controller</title>

<style>

body{
    margin:0;
    background:#f3f2f1;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    background:#003078;
    color:white;
    padding:25px;
    font-size:32px;
    font-weight:bold;
}

.panel{
    background:white;
    width:700px;
    margin:40px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.info{
    font-size:22px;
    margin:15px;
}

.status{
    font-size:22px;
    margin-top:25px;
    color:#003078;
    font-weight:bold;
}

button{
    width:420px;
    height:90px;
    font-size:28px;
    font-weight:bold;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    margin:15px;
}

.start{
    background:#005ea5;
}

.start:hover{
    background:#003078;
}

.end{
    background:#d4351c;
}

.end:hover{
    background:#b10e1e;
}

.value{
    color:#003078;
    font-weight:bold;
}

</style>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

</head>

<body>

<div class="header">
HMCTS HEARING CONTROLLER
</div>

<div class="panel">

<div class="info">
<b>Site</b>
<br><br>
<span id="siteValue" class="value">
Not Supplied
</span>
</div>

<div class="info">
<b>Endpoint</b>
<br><br>
<span id="endpointValue" class="value">
Not Supplied
</span>
</div>

<div class="info">
<b>Cloud Room</b>
<br><br>
<span id="cloudValue" class="value">
Not Supplied
</span>
</div>

<div id="status" class="status">
READY
</div>

<button
class="start"
onclick="startHearing()">
START HEARING
</button>

<br>

<button
class="end"
onclick="endHearing()">
END HEARING
</button>

</div>

<script>

// =========================
// ABLY
// =========================

const ably = new Ably.Realtime("rLuvXQ.hsU1zg:lupB30Cvln6FU__Lkk-aRWKyHCGnZ5cqV_Sp9MD4LP4");

const channel = ably.channels.get("hearings");

// =========================
// POWER APP VALUES
// =========================

const params = new URLSearchParams(window.location.search);

const site = params.get("site");
const endpoint = params.get("endpoint");
const cloudRoom = params.get("cloudroom");
const meetingURL = params.get("url");

let hearingWindow = null;

// =========================
// DISPLAY VALUES
// =========================

document.getElementById("siteValue").innerText =
    site || "Not Supplied";

document.getElementById("endpointValue").innerText =
    endpoint || "Not Supplied";

document.getElementById("cloudValue").innerText =
    cloudRoom || "Not Supplied";

// =========================
// START HEARING
// =========================

function startHearing(){

    channel.publish(
        "hearing",
        {
            test:"hello"
        }
    );

    document.getElementById("status").innerHTML =
        "MESSAGE SENT";

}

    channel.publish(
        "hearing",
        {
            endpoint: endpoint,
            action: "JOIN",
            url: meetingURL
        }
    );

    hearingWindow =
        window.open(
            meetingURL,
            "_blank"
        );

    document.getElementById("status").innerHTML =
        "JOIN MESSAGE SENT";

}

// =========================
// END HEARING
// =========================

function endHearing(){

    channel.publish(
        "hearing",
        {
            endpoint: endpoint,
            action: "END"
        }
    );

    if(
        hearingWindow &&
        !hearingWindow.closed
    ){
        hearingWindow.close();
    }

    document.getElementById("status").innerHTML =
        "END MESSAGE SENT";

}

</script>

</body>
</html>
